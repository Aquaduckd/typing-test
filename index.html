<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="min-h-screen bg-zinc-950 font-['Roboto_Mono',ui-monospace,monospace] text-zinc-300 antialiased selection:bg-amber-500/30"
  >
    <div class="mx-auto flex min-h-screen max-w-5xl flex-col px-6 py-12">
      <header id="live-header" class="mb-10 flex items-end justify-between gap-4">
        <div>
          <h1 class="text-sm font-medium uppercase tracking-[0.2em] text-zinc-500">
            Typing Test
          </h1>
          <p class="mt-1 text-xs text-zinc-600">monkeytype-style · click words to focus</p>
        </div>
        <div class="flex gap-6 text-right text-sm tabular-nums">
          <div>
            <div class="text-xs uppercase tracking-wider text-zinc-600">Time</div>
            <div id="timer" class="text-2xl text-zinc-200">15</div>
          </div>
          <div>
            <div class="text-xs uppercase tracking-wider text-zinc-600">WPM</div>
            <div id="wpm" class="text-2xl text-amber-400">0</div>
          </div>
          <div>
            <div class="text-xs uppercase tracking-wider text-zinc-600">Accuracy</div>
            <div id="accuracy" class="text-2xl text-zinc-200">100</div>
          </div>
        </div>
      </header>

      <main class="flex flex-1 flex-col justify-center">
        <div id="typing-test">
          <div
            id="words-wrapper"
            class="cursor-text rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-8 text-2xl leading-none tracking-wide"
          >
            <div id="words-viewport" class="relative overflow-hidden">
              <textarea
                id="words-input"
                class="pointer-events-none absolute z-[-1] m-0 block h-[1em] w-0 resize-none overflow-hidden border-0 p-0 opacity-0 outline-none"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
              ></textarea>

              <div
                id="caret"
                class="pointer-events-none absolute z-10 h-[1.2em] w-[0.1em] origin-top-left rounded-sm bg-amber-400"
              ></div>

              <div id="words" class="flex w-full flex-wrap content-start gap-x-[0.65em] gap-y-3 leading-none"></div>
            </div>
          </div>

          <p id="status" class="mt-6 h-5 text-center text-sm text-zinc-600">
            Press any key to start
          </p>
        </div>

        <section
          id="result"
          class="hidden opacity-0 flex-col gap-8 transition-opacity duration-200"
          tabindex="-1"
        >
          <div class="grid gap-8 lg:grid-cols-[auto_1fr] lg:items-start">
            <div class="flex flex-col gap-6 tabular-nums">
              <div>
                <div class="text-xs uppercase tracking-wider text-zinc-600">wpm</div>
                <div id="result-wpm" class="text-5xl text-amber-400">-</div>
              </div>
              <div>
                <div class="text-xs uppercase tracking-wider text-zinc-600">acc</div>
                <div id="result-acc" class="text-5xl text-zinc-100">-</div>
              </div>
            </div>

            <div class="min-h-56 rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-4">
              <div class="mb-3 flex items-center justify-between gap-3">
                <div class="text-xs uppercase tracking-wider text-zinc-600">performance</div>
                <div class="flex gap-2 text-xs">
                  <button
                    id="toggle-burst"
                    type="button"
                    class="rounded border border-amber-500/60 px-2 py-1 text-amber-400 transition hover:border-amber-400"
                  >
                    burst
                  </button>
                  <button
                    id="toggle-raw"
                    type="button"
                    class="rounded border border-amber-500/60 px-2 py-1 text-amber-400 transition hover:border-amber-400"
                  >
                    raw
                  </button>
                  <button
                    id="toggle-errors"
                    type="button"
                    class="rounded border border-amber-500/60 px-2 py-1 text-amber-400 transition hover:border-amber-400"
                  >
                    errors
                  </button>
                </div>
              </div>
              <div class="h-48">
                <canvas id="wpm-chart"></canvas>
              </div>
            </div>
          </div>

          <div
            class="flex flex-wrap items-start justify-between gap-y-6 rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-6"
          >
            <div>
              <div class="text-xs uppercase tracking-wider text-zinc-600">raw</div>
              <div id="result-raw" class="mt-1 text-lg text-zinc-200">-</div>
            </div>
            <div>
              <div
                class="text-xs uppercase tracking-wider text-zinc-600"
                title="correct / incorrect / extra / missed"
              >
                characters
              </div>
              <div id="result-chars" class="mt-1 text-lg text-zinc-200">-</div>
            </div>
            <div>
              <div class="text-xs uppercase tracking-wider text-zinc-600">consistency</div>
              <div id="result-consistency" class="mt-1 text-lg text-zinc-200">-</div>
            </div>
            <div>
              <div class="text-xs uppercase tracking-wider text-zinc-600">time</div>
              <div id="result-time" class="mt-1 text-lg text-zinc-200">-</div>
            </div>
          </div>

          <div class="flex justify-end">
            <button
              id="result-restart"
              type="button"
              class="rounded-md border border-zinc-700 px-4 py-2 text-sm text-zinc-400 transition hover:border-zinc-500 hover:text-zinc-200"
            >
              Next test
            </button>
          </div>
        </section>
      </main>

      <footer id="test-footer" class="mt-10 flex justify-end text-xs text-zinc-600">
        <button
          id="restart"
          type="button"
          class="rounded-md border border-zinc-700 px-3 py-1.5 text-zinc-400 transition hover:border-zinc-500 hover:text-zinc-200"
        >
          Restart
        </button>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
